<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      overflow: hidden;
    }
    .container { padding: 20px; position: relative; z-index: 2; }
    h1 {
      font-size: 10rem;
      letter-spacing: 10px;
      background: linear-gradient(90deg, #e94560, #ffb347);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: float 3s ease-in-out infinite;
    }
    p.msg { font-size: 1.8rem; margin: 10px 0; font-style: italic; }
    p.sub { color: #b0b8d0; margin-bottom: 30px; }
    a {
      display: inline-block;
      padding: 12px 32px;
      border-radius: 30px;
      background: #e94560;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      transition: transform .2s, box-shadow .2s;
    }
    a:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(233,69,96,.5); }
    .star {
      position: absolute;
      width: 4px; height: 4px;
      background: #fff;
      border-radius: 50%;
      opacity: .6;
      animation: twinkle 2s infinite alternate;
    }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    @keyframes twinkle { from { opacity: .1; } to { opacity: 1; } }
    @media (max-width: 600px) { h1 { font-size: 6rem; } p.msg { font-size: 1.3rem; } }
  </style>
</head>
<body>
  <div class="star" style="top:10%;left:15%"></div>
  <div class="star" style="top:25%;left:80%;animation-delay:.5s"></div>
  <div class="star" style="top:70%;left:20%;animation-delay:1s"></div>
  <div class="star" style="top:85%;left:70%;animation-delay:1.5s"></div>
  <div class="star" style="top:40%;left:50%;animation-delay:.8s"></div>
  <div class="container">
    <h1>404</h1>
    <p class="msg">Ceci n'est pas une page</p>
    <p class="sub">The page you are looking for has drifted off into space.</p>
    <a href="/">Take me home</a>
  </div>
</body>
</html>
